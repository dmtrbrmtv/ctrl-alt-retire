<title>Тропа к маяку</title>

<style>
/* Layout: one narrow column — pixel scene on top, RPG dialog box under it, results card unfolds below. Single night-sea look, set deliberately. */
:root{
  --ink:#0e0f22;      /* night sky ground */
  --panel:#191a36;    /* dialog box */
  --panel-2:#23244a;  /* buttons */
  --line:#3d3c72;     /* pixel borders */
  --text:#f4ead6;     /* warm paper */
  --muted:#aaa4c8;
  --lamp:#ffd166;     /* lighthouse light, the one accent */
  --sea:#6fb7b8;
  --alert:#ff9a86;
  --alert-bg:#3a1f2c;
  --display:"Press Start 2P", "Courier New", monospace;
  --body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--ink)}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--lamp);display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;background:var(--lamp);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--line);display:inline-block}
.lang{display:flex;gap:0;border:3px solid var(--line)}
.lang button{font-family:var(--display);font-size:10px;padding:8px 10px;min-height:38px;min-width:44px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lamp);color:var(--ink)}
.hdr-r{display:flex;gap:10px;align-items:stretch}
.snd{display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;border:3px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:0}
.snd[aria-pressed="true"]{color:var(--lamp)}
.snd svg{width:20px;height:20px;display:block}
.snd:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.fnt{min-width:44px;min-height:44px;border:3px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:0 8px;font:600 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.fnt[aria-pressed="true"]{color:var(--lamp)}
.fnt:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
/* Readable font option: system font everywhere, slightly larger where the pixel font was tiny */
html.plainfont{--display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html.plainfont .brand{font-size:15px;font-weight:700;letter-spacing:0}
html.plainfont .lang button{font-size:13px;font-weight:700}
html.plainfont .overlay h1{font-weight:800;letter-spacing:0}
html.plainfont .overlay p{font-size:clamp(11px,2vw,15px);font-weight:600;letter-spacing:0}
html.plainfont .who{font-size:13px;font-weight:700;letter-spacing:0}
html.plainfont .choice .key{font-size:12px;font-weight:700}
html.plainfont .choices.solo .choice{font-size:15px;font-weight:700;letter-spacing:0}
html.plainfont .back{font-size:13px}
html.plainfont .lights{font-size:11px;letter-spacing:0}
html.plainfont .eyebrow{font-size:12px;letter-spacing:0}
html.plainfont .card h2{font-size:20px;font-weight:700}
html.plainfont .score b{font-size:52px;font-weight:800}
html.plainfont .score span{font-size:15px}
html.plainfont .scale-l{font-size:11px}
html.plainfont .level{font-size:15px;font-weight:700}
html.plainfont .panel h3{font-size:15px;font-weight:700;letter-spacing:0}
html.plainfont .num{font-size:15px;font-weight:600}
html.plainfont .btn{font-size:14px;font-weight:700;letter-spacing:0}
.permalink{width:100%;box-sizing:border-box;background:var(--ink);color:var(--text);border:3px solid var(--line);padding:10px;font:inherit;font-size:15px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist li::before{background:var(--lamp)!important}
.hist .dl{color:var(--muted);font-size:15px}
.saved-note{font-size:15px;color:#4a4468}
.lang button:focus-visible,.btn:focus-visible,.choice:focus-visible,.back:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

.stage{position:relative;border:3px solid var(--text);box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 #00000080;background:#000;line-height:0}
canvas{width:100%;max-width:100%;aspect-ratio:160/96;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;gap:12px;text-align:center;pointer-events:none;line-height:1.3}
.overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.6vw,34px);margin:0;color:var(--text);text-shadow:3px 3px 0 #1a1238,0 0 18px #ffd16655;text-wrap:balance}
.overlay p{margin:0;font-family:var(--display);font-size:clamp(7px,1.5vw,11px);color:var(--lamp);letter-spacing:.08em;text-shadow:2px 2px 0 #1a1238}

.dialog{position:relative;background:var(--panel);border:3px solid var(--text);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--line),6px 6px 0 #00000080;padding:22px 22px 16px;min-height:220px;display:flex;flex-direction:column;gap:12px;cursor:default}
.who{position:absolute;top:-14px;left:16px;font-family:var(--display);font-size:10px;letter-spacing:.06em;background:var(--lamp);color:var(--ink);padding:6px 9px;box-shadow:3px 3px 0 #00000080}
.line{margin:0;font-size:19px;min-height:2.9em;max-width:62ch;text-wrap:pretty}
.line.cursor::after{content:"▮";color:var(--lamp);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.q{display:flex;flex-direction:column;gap:4px;border-top:3px dashed var(--line);padding-top:12px}
.q .prompt{font-size:15px;color:var(--muted)}
.q strong{font-size:21px;font-weight:600;line-height:1.35;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.solo{grid-template-columns:minmax(0,1fr)}
.choice,.btn{font-family:var(--body);font-size:17px;text-align:left;color:var(--text);background:var(--panel-2);border:3px solid var(--text);box-shadow:0 4px 0 var(--line);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:52px;transition:transform .06s}
.choice:hover,.btn:hover{background:#2d2e5c}
.choice:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice .key{font-family:var(--display);font-size:9px;background:var(--ink);color:var(--lamp);padding:5px 6px;flex:none}
.choice.sel{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
.choice.sel .key{background:var(--ink)}
.choices.solo .choice{justify-content:center;font-family:var(--display);font-size:12px;letter-spacing:.06em;background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
.choices.solo .choice .key{display:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.back{font-family:var(--display);font-size:9px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
.back:hover{color:var(--text)}
.lights{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:8px;color:var(--muted);letter-spacing:.06em}
.lights b{width:9px;height:9px;background:var(--line);display:inline-block}
.lights b.on{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.privacy{font-size:14px;color:var(--muted);margin:0;max-width:62ch}

/* results */
.result{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.card{background:var(--text);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--text),8px 8px 0 3px #00000090;padding:22px;display:flex;flex-direction:column;gap:12px;margin:3px}
.eyebrow{font-family:var(--display);font-size:9px;letter-spacing:.08em;color:#5b5480;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2{font-family:var(--display);font-weight:400;font-size:16px;margin:0}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-size:46px;font-weight:400;line-height:1}
.score span{font-family:var(--display);font-size:12px;color:#5b5480}
.scale{position:relative;display:flex;height:16px;border:3px solid var(--ink);margin-top:10px}
.scale span{height:100%}
.scale .mark{position:absolute;top:-12px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-50%)}
.scale-l{display:flex;font-family:var(--display);font-size:7px;color:#5b5480;font-variant-numeric:tabular-nums}
.scale-l span{text-align:center}
.level{font-family:var(--display);font-size:12px;line-height:1.6;margin:4px 0 0;display:flex;align-items:center;gap:10px}
.level i{width:14px;height:14px;flex:none;border:3px solid var(--ink)}
.card p{margin:0;max-width:60ch}
.card .diff{font-size:15px;color:#4a4468}
.shot{font-size:14px;color:var(--muted);margin:-6px 0 0}

.panel{background:var(--panel);border:3px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--lamp);margin:0;line-height:1.6}
.panel p{margin:0;max-width:62ch}
.panel ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.panel li{display:flex;gap:10px}
.panel li::before{content:"";width:8px;height:8px;margin-top:9px;background:var(--sea);flex:none}
.crisis{background:var(--alert-bg);border-color:var(--alert)}
.crisis h3{color:var(--alert)}
.crisis li::before{background:var(--alert)}
.crisis a.btn{text-decoration:none}
.crisis a:not(.btn),.panel a.link{color:var(--text);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.num{font-family:var(--display);font-size:11px;letter-spacing:.04em;user-select:all;overflow-wrap:anywhere}
textarea{width:100%;box-sizing:border-box;min-height:96px;resize:vertical;background:var(--ink);color:var(--text);border:3px solid var(--line);padding:10px;font:inherit;font-size:16px}
textarea:focus{outline:none;border-color:var(--sea)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-size:10px;letter-spacing:.04em;min-height:44px;text-decoration:none;justify-content:center}
.btn.primary{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
.check{display:flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--lamp)}
.about{font-size:14px;color:var(--muted);margin:0;max-width:66ch}

@media (max-width:520px){
  body{font-size:17px}
  .choices{grid-template-columns:minmax(0,1fr)}
  .dialog{padding:20px 14px 14px}
  .line{font-size:17px}
  .q strong{font-size:19px}
  .choice{min-height:46px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .line.cursor::after{animation:none}
  .choice,.btn{transition:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i><span data-t="brand">Тропа к маяку</span></div>
    <div class="hdr-r">
      <button class="fnt" id="fnt" type="button" aria-pressed="false">Aa</button>
      <button class="snd" id="snd" type="button" aria-pressed="true"></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-ru" type="button" aria-pressed="true">RU</button>
        <button id="lang-en" type="button" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" width="160" height="96" aria-label="Пиксельный берег и маяк"></canvas>
    <div class="overlay" id="overlay">
      <h1 data-t="title">Тропа к маяку</h1>
      <p data-t="sub">9 вопросов · 3 минуты</p>
    </div>
  </div>

  <section class="dialog" id="dlg" aria-live="polite">
    <div class="who" id="who" hidden></div>
    <p class="line" id="line"></p>
    <div class="q" id="q" hidden><span class="prompt" id="qprompt"></span><strong id="qtext"></strong></div>
    <div class="choices" id="choices"></div>
    <div class="foot">
      <button class="back" id="back" type="button" hidden></button>
      <div class="lights" id="lights"></div>
    </div>
  </section>
  <p class="privacy" id="privacy"></p>

  <section class="result" id="result" hidden></section>
</div>

<script>

function shareLinks(text){ const e=encodeURIComponent(text); return {tg:`https://t.me/share/url?url=${e}`,wa:`https://wa.me/?text=${e}`}; }
// The result being shown: the walk just finished, or one opened from a saved link (score, difficulty and date only)
function cur(){ return S.view||{s:score(),df:S.ans[9],q9:S.ans[8]||0,date:S.doneAt||new Date()}; }
const fmtDate=d=>d.toLocaleDateString(lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long',year:'numeric'});
function famText(){ const t=L(), s=cur().s; return S.incScore?t.msgScore(s,t.levels[levelOf(s)]):t.msgPlain; }
function renderResult(){
  const t=L(), c=cur(), s=c.s, lv=levelOf(s), q9=c.q9;
  const date=fmtDate(c.date);
  const segs=[5,5,5,5,8], labels=['0–4','5–9','10–14','15–19','20–27'];
  let h='';
  if(q9>0||lv===4){
    h+=`<section class="panel crisis"><h3>${esc(t.crisisTitle)}</h3><p>${esc(q9>0?t.crisis9:t.crisisHigh)}</p><ul>`+
      t.lines.map(l=>`<li><span>${esc(l[0])}: <span class="num">${esc(l[1])}</span></span></li>`).join('')+
      `<li><span>${esc(t.otherCountries)} <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a></span></li></ul>`+
      `<p>${esc(t.sos)}</p><textarea id="sos-msg" aria-label="${esc(t.sos)}">${esc(t.sosMsg)}</textarea>`+
      `<div class="row"><button class="btn primary" type="button" data-copy="sos-msg">${esc(t.copy)}</button>`+
      `<a class="btn" id="sos-tg" target="_blank" rel="noopener">Telegram</a><a class="btn" id="sos-wa" target="_blank" rel="noopener">WhatsApp</a></div></section>`;
  }
  h+=`<article class="card" aria-label="${esc(t.resTitle)}"><div class="eyebrow"><span>PHQ-9</span><span>${esc(date)}</span></div>`+
    `<h2>${esc(t.resTitle)}</h2><div class="score"><b>${s}</b><span>${esc(t.of)}</span></div>`+
    `<div class="scale">`+segs.map((w,i)=>`<span style="flex:${w};background:${LEVEL_COLORS[i]}"></span>`).join('')+`<i class="mark" style="left:${((s+.5)/28*100).toFixed(2)}%"></i></div>`+
    `<div class="scale-l">`+segs.map((w,i)=>`<span style="flex:${w}">${labels[i]}</span>`).join('')+`</div>`+
    `<p class="level"><i style="background:${LEVEL_COLORS[lv]}"></i>${esc(t.levels[lv])}</p><p>${esc(t.desc[lv])}</p>`+
    (c.df!=null?`<p class="diff">${esc(t.diff)} ${esc(t.a10[c.df].toLowerCase())}</p>`:'')+(S.view?`<p class="saved-note">${esc(t.savedNote)}</p>`:'')+`</article>`+
    `<div class="row"><button class="btn" type="button" id="save-img">${esc(t.saveImg)}</button><span class="shot" style="margin:0">${esc(t.imgNote)}</span></div>`;
  if(!S.view){
    h+=`<section class="panel"><h3>${esc(t.saveTitle)}</h3><p>${esc(t.saveNote)}</p>`+
      `<input class="permalink" id="perm" readonly value="${esc(permalink(c))}" aria-label="${esc(t.saveTitle)}">`+
      `<div class="row"><button class="btn primary" type="button" data-copy="perm">${esc(t.copy)}</button></div></section>`;
  }
  const hist=loadHist();
  if(hist.length>1||(S.view&&hist.length)){
    const prev=S.view?null:hist[hist.length-2];
    let cmp='';
    if(prev){ const d=s-prev.s, pd=fmtDate(new Date(prev.t)); cmp=`<p>${esc(s)} ${esc(t.of)} — ${esc(d===0?t.sameAs(pd):(d<0?t.less(-d):t.more(d))+t.than(pd))}</p>`; }
    h+=`<section class="panel"><h3>${esc(t.histTitle)}</h3>${cmp}<ul class="hist">`+hist.slice(-8).reverse().map(e=>`<li><span><span class="dl">${esc(fmtDate(new Date(e.t)))}</span> · <b>${e.s}</b> ${esc(t.of)} · ${esc(t.levels[levelOf(e.s)])}</span></li>`).join('')+
      `</ul><p class="about">${esc(t.histNote)}</p><div class="row"><button class="btn" type="button" id="hist-clear">${esc(t.histClear)}</button></div></section>`;
  }
  h+=`<section class="panel"><h3>${esc(t.tipsTitle)}</h3><ul>`+t.tips[lv].map(x=>`<li><span>${esc(x)}</span></li>`).join('')+`</ul></section>`;
  h+=`<section class="panel"><h3>${esc(t.shareTitle)}</h3><p>${esc(t.shareNote)}</p>`+
    `<label class="check"><input type="checkbox" id="inc-score" ${S.incScore?'checked':''}> ${esc(t.incScore)}</label>`+
    `<textarea id="fam-msg" aria-label="${esc(t.shareTitle)}">${esc(famText())}</textarea>`+
    `<div class="row"><button class="btn primary" type="button" id="fam-share">${esc(t.share)}</button><button class="btn" type="button" data-copy="fam-msg">${esc(t.copy)}</button>`+
    `<a class="btn" id="fam-tg" target="_blank" rel="noopener">Telegram</a><a class="btn" id="fam-wa" target="_blank" rel="noopener">WhatsApp</a></div><p class="about">${esc(t.tgNote)}</p></section>`;
  h+=`<section class="panel"><h3>${esc(t.inviteTitle)}</h3><p>${esc(t.inviteNote)}</p>`+
    `<textarea id="inv-msg" aria-label="${esc(t.inviteTitle)}">${esc(t.invite(INVITE_URL))}</textarea>`+
    `<div class="row"><button class="btn primary" type="button" id="inv-share">${esc(t.share)}</button><button class="btn" type="button" data-copy="inv-msg">${esc(t.copy)}</button>`+
    `<a class="btn" id="inv-tg" target="_blank" rel="noopener">Telegram</a><a class="btn" id="inv-wa" target="_blank" rel="noopener">WhatsApp</a></div></section>`;
  h+=`<p class="about">${esc(t.about)}</p>`;
  resEl.innerHTML=h;
  const flash=(b,msg)=>{const o=b.textContent;b.textContent=msg;setTimeout(()=>b.textContent=o,2200);};
  setTimeout(prepCard,250);
  $('save-img').addEventListener('click',async e=>{const b=e.currentTarget;try{downloadBlob(cardCache.blob||await prepCard());flash(b,t.imgSaved);}catch(err){}});
  // The result image goes along only when "Include my result" is checked
  $('fam-share').addEventListener('click',e=>shareOut(e.currentTarget,$('fam-msg').value,S.incScore));
  $('inv-share').addEventListener('click',e=>shareOut(e.currentTarget,$('inv-msg').value,false));
  const hc=$('hist-clear'); if(hc) hc.addEventListener('click',()=>{ try{localStorage.removeItem('lh-history');}catch(e){} hc.textContent=t.histCleared; hc.disabled=true; });
  ['sos','fam','inv'].forEach(k=>{ const ta=$(k+'-msg'); if(!ta) return; const upd=()=>{const l=shareLinks(ta.value); $(k+'-tg').href=l.tg; $(k+'-wa').href=l.wa;}; ta.addEventListener('input',upd); upd(); });
  const inc=$('inc-score'); inc.addEventListener('change',()=>{ S.incScore=inc.checked; const ta=$('fam-msg'); ta.value=famText(); ta.dispatchEvent(new Event('input')); });
  resEl.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    const ta=$(b.dataset.copy), orig=t.copy;
    const ok=()=>{b.textContent=t.copied; setTimeout(()=>b.textContent=orig,1600);};
    const fail=()=>{ta.focus(); ta.select(); b.textContent=t.selected; setTimeout(()=>b.textContent=orig,2400);};
    try{ navigator.clipboard.writeText(ta.value).then(ok,fail); }catch(e){ fail(); }
  }));
}

/* ---------- language ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=L()[el.dataset.t]);
  $('privacy').textContent=L().privacy; cv.setAttribute('aria-label',L().canvas);
  $('lang-ru').setAttribute('aria-pressed',lang==='ru'); $('lang-en').setAttribute('aria-pressed',lang==='en');
  renderSound(); renderFont();
}
// Speaker icon drawn from square "pixels"; waves only when the sound is on
function renderSound(){
  const b=$('snd'), v=Music.playing;
  b.setAttribute('aria-pressed',v); b.setAttribute('aria-label',v?L().soundOn:L().soundOff); b.title=b.getAttribute('aria-label');
  b.innerHTML=`<svg viewBox="0 0 10 10" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="1" y="4" width="2" height="2"/><rect x="3" y="3" width="1" height="4"/><rect x="4" y="2" width="1" height="6"/>${v?'<rect x="6" y="4" width="1" height="2"/><rect x="7" y="2" width="1" height="1"/><rect x="8" y="3" width="1" height="4"/><rect x="7" y="7" width="1" height="1"/>':'<rect x="6" y="3" width="1" height="1"/><rect x="7" y="4" width="1" height="2"/><rect x="8" y="3" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/>'}</svg>`;
}
$('snd').addEventListener('click',()=>{ Music.setOn(!Music.playing); setTimeout(renderSound,150); renderSound(); });
function renderFont(){ const b=$('fnt'); b.setAttribute('aria-pressed',plainFont); const l=plainFont?L().fontPixel:L().fontPlain; b.setAttribute('aria-label',l); b.title=l; }
$('fnt').addEventListener('click',()=>{ plainFont=!plainFont; try{localStorage.setItem('lh-font',plainFont?'plain':'pixel');}catch(e){} document.documentElement.classList.toggle('plainfont',plainFont); renderFont(); });
function setLang(l){
  if(l===lang) return; lang=l; try{localStorage.setItem('lh-lang',l);}catch(e){}
  applyStatic();
  ({title:goTitle,intro:goIntro,ask:()=>ask(S.idx),ask10:ask10,end:goEnd,result:()=>showResult(false),saved:showSaved,
    walk:()=>show({text:L().walking[S.idx%L().walking.length]})}[S.phase]||goTitle)();
}
$('lang-ru').addEventListener('click',()=>setLang('ru'));
$('lang-en').addEventListener('click',()=>setLang('en'));

// A saved link opens straight onto the result card. The hash is removed from the address bar right away,
// before the page-view counter loads, so the score never leaves the device.
function readSaved(){
  const m=/^#r=1\.(\d{1,2})\.([0-3x])\.(\d{4})(\d{2})(\d{2})$/.exec(location.hash||''); if(!m) return null;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  const s=+m[1]; if(s>27) return null;
  const d=new Date(+m[3],+m[4]-1,+m[5]); if(isNaN(d)) return null;
  return {s,df:m[2]==='x'?null:+m[2],q9:0,date:d};
}
function showSaved(){
  S.phase='saved'; S.final=true; S.px=stopX(9); S.target=S.px; overlay.hidden=true;
  renderResult(); resEl.hidden=false;
  show({who:L().keeper,text:L().savedLine(fmtDate(S.view.date)),choices:[{label:L().walkNow,act:restart}]});
}
const savedView=readSaved();
applyStatic();
if(savedView){ S.view=savedView; showSaved(); } else goTitle();
requestAnimationFrame(loop);
})();
</script>
